apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/environment: production

images:
  - name: card-service
    newName: registry.bmicc.ir/library/cardservice
    newTag: latest   # pin a released tag for production deployments

patches:
  - target:
      kind: ConfigMap
      name: card-service-config
    patch: |-
      # Do NOT add the "production" profile yet: it switches to CreditServiceRealImpl,
      # which is not implemented (throws UnsupportedOperationException).
      - op: replace
        path: /data/SSM_BASE_URL
        value: "https://<host>:8018"
  - target:
      kind: Deployment
      name: card-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 2Gi
  - target:
      kind: HorizontalPodAutoscaler
      name: card-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
  - target:
      kind: PodDisruptionBudget
      name: card-service
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
