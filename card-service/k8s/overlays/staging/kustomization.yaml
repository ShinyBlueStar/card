apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/environment: staging

images:
  - name: card-service
    newName: registry.bmicc.ir/library/cardservice
    newTag: latest   # CI sets the commit tag: kustomize edit set image card-service=...:$CI_COMMIT_SHORT_SHA

patches:
  - target:
      kind: ConfigMap
      name: card-service-config
    patch: |-
      - op: replace
        path: /data/CARD_DATASOURCE_URL
        value: "jdbc:oracle:thin:@//racs-scan.bmicc.ir:1521/card_stgsrv.bmicc.ir"
      - op: replace
        path: /data/SSM_BASE_URL
        value: "https://192.168.104.20:8009"
  - target:
      kind: HorizontalPodAutoscaler
      name: card-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: Deployment
      name: card-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
